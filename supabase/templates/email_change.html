<!DOCTYPE html>
<html lang="en">
  <body style="margin:0;padding:0;background:#06080A;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#06080A;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#0C1013;border:1px solid #232D36;border-radius:10px;">
            <tr>
              <td style="padding:28px 32px 4px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;letter-spacing:2px;font-weight:600;color:#FF9F00;">
                RIFF
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;color:#EEF2F5;">
                Confirm your new email
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;color:#9AA8B3;">
                Confirm {{ .NewEmail }} as the new address for this Riff account.
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FF9F00;color:#0A0A0A;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;padding:12px 20px;border-radius:4px;">
                  Confirm new email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#7D8B96;">
                If you did not ask to change this email, you can ignore this message.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
