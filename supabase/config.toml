# Supabase Configuration for Riff Backend
# Auto-generated by Supabase CLI - customize as needed

project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
# OAuth providers - enable these in Supabase dashboard
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # Set to true for production

[auth.external.apple]
enabled = true
client_id = ""
secret = ""
redirect_uri = "riff://oauth/callback"

[auth.external.google]
enabled = true
client_id = ""
secret = ""
redirect_uri = "riff://oauth/callback"

[auth.external.github]
enabled = true
client_id = ""
secret = ""
redirect_uri = "riff://oauth/callback"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false  # Not needed for Riff

[storage]
enabled = false  # Not using blob storage for now

[edge_functions]
enabled = true

[analytics]
enabled = false
