# Supabase project configuration
# This file is used by the Supabase CLI

project_id = "yrsviodciuepunofxoja"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "riff://auth/callback"
additional_redirect_urls = ["riff://auth/callback", "riff://oauth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Riff email"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Riff password"
content_path = "./templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Riff sign-in link"
content_path = "./templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new Riff email"
content_path = "./templates/email_change.html"

# Edge Functions
[functions]
